name: Android Release Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.extract-version.outputs.version-name }}
      version-code: ${{ steps.extract-version.outputs.version-code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version information
        id: extract-version
        run: |
          echo "Extracting version information from AndroidConfiguration.kt..."
          
          # Extract version name
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' build-logic/convention/src/main/kotlin/com/application/sync/AndroidConfiguration.kt)
          echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Found version name: $VERSION_NAME"
          
          # Extract version code
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' build-logic/convention/src/main/kotlin/com/application/sync/AndroidConfiguration.kt)
          echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Found version code: $VERSION_CODE"
          
          # If this is a tag push, use the tag as version name
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/}
            echo "version-name=$TAG_VERSION" >> $GITHUB_OUTPUT
            echo "Using tag version: $TAG_VERSION"
          fi

  build:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display version information
        run: |
          echo "Building version: ${{ needs.setup.outputs.version-name }}"
          echo "Version code: ${{ needs.setup.outputs.version-code }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup secrets.properties
        run: |
          echo "Creating secrets.properties..."
          cat > secrets.properties << EOF
          PROD_BACKEND_URL=${{ secrets.BACKEND_URL }}
          EOF

      - name: Setup key.properties
        run: |
          echo "Creating key.properties..."
          cat > key.properties << EOF
          KEYSTORE_FILE=../keystores/release-keystore.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Setup release keystore
        run: |
          echo "Setting up release keystore..."
          mkdir -p keystores
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystores/release-keystore.jks

      - name: Setup google-services.json
        run: |
          echo "Setting up google-services.json..."
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Build productionRelease APK
        run: ./gradlew assembleProductionRelease

      - name: Build productionRelease AAB
        run: ./gradlew bundleProductionRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release-apk-v${{ needs.setup.outputs.version-name }}
          path: app/build/outputs/apk/production/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release-aab-v${{ needs.setup.outputs.version-name }}
          path: app/build/outputs/bundle/productionRelease/*.aab
          retention-days: 30

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-v${{ needs.setup.outputs.version-name }}
          path: |
            app/build/reports/
            build/reports/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ setup, build ]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: production-release-apk-v${{ needs.setup.outputs.version-name }}
          path: ./apk

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: production-release-aab-v${{ needs.setup.outputs.version-name }}
          path: ./aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ needs.setup.outputs.version-name }}
          tag_name: v${{ needs.setup.outputs.version-name }}
          files: |
            ./apk/*.apk
            ./aab/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Release v${{ needs.setup.outputs.version-name }}
            
            **Version Code:** ${{ needs.setup.outputs.version-code }}
            
            ### Files
            - `*.apk` - Android APK file for direct installation
            - `*.aab` - Android App Bundle for Google Play Store
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
