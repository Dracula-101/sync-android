name: Android Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.extract-version.outputs.version-name }}
      version-code: ${{ steps.extract-version.outputs.version-code }}
      should-release: ${{ steps.check-tag.outputs.should-release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version information
        id: extract-version
        run: |
          echo "Extracting version information from AndroidConfiguration.kt..."
          
          # Extract version name
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' build-logic/convention/src/main/kotlin/com/application/sync/AndroidConfiguration.kt)
          echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Found version name: $VERSION_NAME"
          
          # Extract version code
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' build-logic/convention/src/main/kotlin/com/application/sync/AndroidConfiguration.kt)
          echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Found version code: $VERSION_CODE"

      - name: Check if tag exists
        id: check-tag
        run: |
          VERSION_NAME="${{ steps.extract-version.outputs.version-name }}"
          VERSION_CODE="${{ steps.extract-version.outputs.version-code }}"
          TAG_NAME="v${VERSION_NAME}+${VERSION_CODE}"
          
          echo "Checking for existing tag: $TAG_NAME"
          
          # Check if tag exists on GitHub
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            echo "Tag $TAG_NAME already exists"
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG_NAME does not exist, will create release"
            echo "should-release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display version information
        run: |
          echo "Building version: ${{ needs.setup.outputs.version-name }}"
          echo "Version code: ${{ needs.setup.outputs.version-code }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup secrets.properties
        run: |
          echo "Creating secrets.properties..."
          cat > secrets.properties << EOF
          PROD_BACKEND_URL=${{ secrets.BACKEND_URL }}
          EOF

      - name: Setup key.properties
        run: |
          echo "Creating key.properties..."
          cat > key.properties << EOF
          KEYSTORE_FILE=../keystores/release-keystore.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Setup release keystore
        run: |
          echo "Setting up release keystore..."
          mkdir -p keystores
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystores/release-keystore.jks

      - name: Setup google-services.json
        run: |
          echo "Setting up google-services.json..."
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Build productionRelease APK
        run: ./gradlew assembleProductionRelease --parallel --build-cache --info --stacktrace > build-android-apk.log 2>&1

      - name: Build productionRelease AAB
        run: ./gradlew bundleProductionRelease --parallel --build-cache --info --stacktrace > build-android-aab.log 2>&1

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-v${{ needs.setup.outputs.version-name }}
          path: |
            build-android-apk.log
            build-android-aab.log
          retention-days: 30

      - name: Cleanup sensitive files
        if: always()
        run: |
          echo "Cleaning up sensitive files..."
          rm -f secrets.properties
          rm -f key.properties
          rm -f app/google-services.json
          rm -f keystores/release-keystore.jks
          echo "Sensitive files cleaned up"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release-apk-v${{ needs.setup.outputs.version-name }}
          path: app/build/outputs/apk/production/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release-aab-v${{ needs.setup.outputs.version-name }}
          path: app/build/outputs/bundle/productionRelease/*.aab
          retention-days: 15

  release:
    if: needs.setup.outputs.should-release == 'true'
    needs: [ setup, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: production-release-apk-v${{ needs.setup.outputs.version-name }}
          path: ./apk

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: production-release-aab-v${{ needs.setup.outputs.version-name }}
          path: ./aab

      - name: Prepare commit data for AI
        id: prepare-data
        run: |
          VERSION_NAME="${{ needs.setup.outputs.version-name }}"
          VERSION_CODE="${{ needs.setup.outputs.version-code }}"
          TAG_NAME="v${VERSION_NAME}+${VERSION_CODE}"
          
          echo "Preparing commit data for AI analysis..."
          
          # Get the previous release tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$" | head -1)
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release found, getting recent commits"
            COMMIT_DETAILS=$(git log -n 20 --pretty=format:"- %s (%an, %ar)" --name-only)
            FILE_CHANGES=$(git diff --name-only HEAD~20 HEAD | head -20)
            TOTAL_COMMITS=$(git rev-list --count HEAD | head -20)
          else
            echo "Previous release: $PREV_TAG"
            COMMIT_DETAILS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%an, %ar)" --name-only)
            FILE_CHANGES=$(git diff --name-only ${PREV_TAG}..HEAD | head -30)
            TOTAL_COMMITS=$(git rev-list --count ${PREV_TAG}..HEAD)
          fi
          
          # Set outputs for use in AI step
          {
            echo 'COMMIT_DETAILS<<EOF'
            echo "$COMMIT_DETAILS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          
          {
            echo 'FILE_CHANGES<<EOF'
            echo "$FILE_CHANGES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          
          echo "total-commits=$TOTAL_COMMITS" >> $GITHUB_OUTPUT
          echo "prev-tag=${PREV_TAG:-None (First Release)}" >> $GITHUB_OUTPUT
          
          echo "AI data prepared with $TOTAL_COMMITS commits"

      - name: Generate release notes with AI
        id: ai-inference
        uses: actions/ai-inference@v1
        continue-on-error: true
        with:
          prompt: |
            TASK: Create professional release notes for the Sync Android app based ONLY on the provided commit data.
            
            IMPORTANT INSTRUCTIONS:
            - Do NOT ask for more information or suggest providing commit messages
            - Do NOT include generic examples or placeholders
            - Do NOT add phrases like "Feel free to share" or "Thank you for using our app"
            - Only analyze the actual commit data provided below
            - If no significant user-facing changes, simply state it's a maintenance release
            - Focus exclusively on the commits and file changes listed
            
            APP INFORMATION:
            - App Name: Sync (Social Media Android App)
            - Version: ${{ needs.setup.outputs.version-name }}
            - Version Code: ${{ needs.setup.outputs.version-code }}
            - Total Commits: ${{ steps.prepare-data.outputs.total-commits }}
            - Previous Release: ${{ steps.prepare-data.outputs.prev-tag }}
            
            COMMIT DATA TO ANALYZE:
            ${{ steps.prepare-data.outputs.COMMIT_DETAILS }}
            
            FILES CHANGED:
            ${{ steps.prepare-data.outputs.FILE_CHANGES }}
            
            REQUIRED OUTPUT FORMAT:
            Create markdown release notes with these sections ONLY if relevant changes exist:
            
            ## Release Summary
            Brief overview of this release (always include this section)
            
            ## New Features
            List any new functionality (SKIP this section entirely if no new features were added)
            
            ## Bug Fixes
            List resolved issues (SKIP this section entirely if no bugs were fixed)
            
            ## Improvements
            List performance or UX improvements (SKIP this section entirely if no improvements were made)
            
            ## Technical Changes
            List refactoring, dependency updates, build changes (SKIP this section entirely if no technical work was done)
            
            CRITICAL RULES:
            - If a section has no relevant commits, DO NOT include that section header at all
            - Do not write "No changes" or "None" - simply omit the entire section
            - Only include section headers when you have actual content to put under them
            - If only technical/build changes exist, only include Release Summary and Technical Changes
            - If only bug fixes exist, only include Release Summary and Bug Fixes
            - Empty sections make the release notes look unprofessional
            
            ANALYSIS GUIDELINES:
            - UI/UX files: Focus on user experience changes
            - Build files: Mention dependency updates or build improvements
            - Core/Network files: Mention backend or API improvements
            - Bug fix commits: Clearly state what was fixed
            - Feature commits: Explain new functionality
            - Skip sections that don't apply to the commits
            - Keep descriptions concise and user-focused
            - No emojis or decorative elements
          model: 'openai/gpt-4o'
          max-tokens: 2000

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Sync v${{ needs.setup.outputs.version-name }} (Build ${{ needs.setup.outputs.version-code }})"
          tag_name: v${{ needs.setup.outputs.version-name }}+${{ needs.setup.outputs.version-code }}
          files: |
            ./apk/*.apk
            ./aab/*.aab
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ${{ steps.ai-inference.outcome == 'success' && steps.ai-inference.outputs.response || '' }}
            
            ## Technical Details
            
            - **Version**: ${{ needs.setup.outputs.version-name }}
            - **Version Code**: ${{ needs.setup.outputs.version-code }}
            - **Build Date**: ${{ github.run_started_at }}
            
            ## Download
            
            Choose the appropriate file for your needs:
            - **APK**: For direct installation on Android devices
            - **AAB**: Optimized for Google Play Store distribution
            
            ## Support
            
            If you encounter any issues, please report them in our [GitHub Issues](https://github.com/${{ github.repository }}/issues).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f ai-prompt.txt
